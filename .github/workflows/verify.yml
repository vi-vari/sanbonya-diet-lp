# プルリクエスト（main にマージする前）の段階で LP を検証する。
# ここが赤いうちはマージ・公開しないこと。
name: Verify LP

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm check

      - name: Check bundled images
        run: pnpm check:images

      - name: Build
        run: pnpm run build:pages
        env:
          VITE_BASE_PATH: /sanbonya-diet-lp/

      - name: Install Chromium for smoke test
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test (画像・リンクをスマホ相当のブラウザで検証)
        run: pnpm test:smoke
